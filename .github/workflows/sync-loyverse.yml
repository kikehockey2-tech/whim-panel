name: Sincronizar ventas de Loyverse

on:
  schedule:
    # Frecuente. GitHub a menudo retrasa o descarta este cron (en la
    # práctica arranca unas pocas veces al día, no cada 15 minutos).
    # Cuando sí corre, refresca las ventas. El límite de Loyverse es 300
    # solicitudes cada 300 segundos; esta corrida usa solo unas pocas.
    - cron: "*/15 * * * *"
    # Garantía diaria, fuera del minuto 0 (ahí se amontonan los cron y
    # GitHub tira corridas). 14:17 UTC = 08:17 en Monterrey.
    - cron: "17 14 * * *"
    # Segunda ancla al cierre del día: 23:17 UTC = 17:17 en Monterrey,
    # para que las ventas del día queden commiteadas aunque el */15 no dispare.
    - cron: "17 23 * * *"
  workflow_dispatch: {}  # también se puede correr a mano desde GitHub

permissions:
  contents: write

# Una sola corrida por rama. La que ya empezó termina y sube data.json;
# la siguiente espera, no se cancela a la mitad de un push.
concurrency:
  group: loyverse-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # schedule corre sobre la rama por defecto (main) y el push vuelve ahí.
          # workflow_dispatch usa la rama que se elige en el botón.
          ref: ${{ github.ref_name }}
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalar ventas reales de Loyverse
        env:
          LOYVERSE_TOKEN: ${{ secrets.LOYVERSE_TOKEN }}
        run: |
          if [ -z "$LOYVERSE_TOKEN" ]; then
            echo "LOYVERSE_TOKEN no está en el ambiente. El secreto del repositorio falta o este workflow no lo recibe."
            exit 1
          fi
          python3 scripts/sync_loyverse.py

      - name: Subir data.json a la rama
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- data.json; then
            echo "Sin cambios en las ventas, no hay nada que subir."
            exit 0
          fi
          git config user.name "whim-sync-bot"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Actualiza ventas reales de Loyverse ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
